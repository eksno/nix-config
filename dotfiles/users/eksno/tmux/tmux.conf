# --- Basic Options ---
# Unbind default prefix and set to C-a
unbind C-b
set -g prefix C-a

# Set default terminal and shell (adjust shell path as necessary)
set -g default-terminal "screen-256color"

# Key mode set to vi
set-option -g mode-keys vi

# Set base index for windows to 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Shorter notification display (tmux-sensible sets 4000ms)
set -g display-time 1000

# Enable 24-hour clock
set-option -g status-interval 60
set-option -g status-right "#{t:%H:%M:%S}"

# History limit
set-option -g history-limit 100000

# Enable mouse support
set-option -g mouse on

# Increase history limit and enable mouse support
set -g history-limit 100000
set -g mouse on

# --- TPM Plugin Initialization ---
# List TPM and plugins (ensure TPM is installed at ~/.tmux/plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#latest' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- Plugin-Specific Settings ---

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

# Load catppuccin
run ~/.config/tmux/plugins/tmux/catppuccin/catppuccin.tmux

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-delete-backup-after '1'
# ~prefix matches anywhere in the command (needed for NixOS /nix/store/ paths)
# ( |$) suffix ensures word-boundary matching (prevents e.g. ~vi matching "vite")
# ->cmd provides a clean restore command instead of the raw nix store path
set -g @resurrect-processes '"~nvim( |$)->nvim" "~vim( |$)->vim" "~vi( |$)->vi" "~nix-shell->ndc" "~mosh-client->~/.config/tmux/scripts/restore-mosh.sh" "~ssh( |$)->ssh *" "~btop( |$)" "~bluetuith( |$)" "~nmtui( |$)" "~lazygit( |$)" "~bun( |$)" "~uv( |$)" "~pulsemixer( |$)" "~claude( |$)"'
set -g @resurrect-hook-pre-restore-pane-processes 'sleep 5'

# Continuum settings
# Restore is handled by fish (nix_config.fish) to avoid race conditions
set -g @continuum-restore 'off'
set -g @continuum-save-interval '1'

# --- Window Bindings ---

# Open new windows in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# --- Split & Copy Mode Bindings ---

# Open new splits in the current pane's directory
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Use vim key bindings in copy mode
setw -g mode-keys vi

# Vim-like copy mode selections
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi C-v run-shell 'tmux send-keys -X rectangle-toggle; tmux send-keys -X begin-selection'

# Yank selection via a pipeline that removes trailing newline and copies to clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "perl -pe 'chomp if eof' | tmux load-buffer - ; tmux save-buffer - | wl-copy -n"


# Press Escape to enter copy mode
bind Escape copy-mode

# --- Status and Paste Bindings ---

# Place status bar at the top
set-option -g status-position top

# Bind 'p' to paste-buffer (overriding default)
unbind p
bind p paste-buffer

# Allow passthrough and update environment variables
set -g allow-passthrough on
set -ga update-environment "TERM"
set -ga update-environment "TERM_PROGRAM"

# --- Pane Resizing in Copy Mode ---

bind-key -T copy-mode-vi M-h resize-pane -L 1
bind-key -T copy-mode-vi M-j resize-pane -D 1
bind-key -T copy-mode-vi M-k resize-pane -U 1
bind-key -T copy-mode-vi M-l resize-pane -R 1

# --- Reload the tmux configuration --
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded."

# --- TPM Initialization ---
# Keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
