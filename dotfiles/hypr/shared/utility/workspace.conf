# Smart gaps: single tiled window fills the screen
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule {
  name = smart-gaps-tv1
  match:float = false
  match:workspace = w[tv1]
  border_size = 0
  rounding = 0
}

windowrule {
  name = smart-gaps-f1
  match:float = false
  match:workspace = f[1]
  border_size = 0
  rounding = 0
}

workspace = 1
workspace = 2
workspace = 3
workspace = 4
workspace = 5
workspace = 6
workspace = 7
workspace = 8
workspace = 9
workspace = 10
workspace = 11
workspace = 12
workspace = 13
workspace = 14
workspace = 15
workspace = 16
workspace = 17
workspace = 18
