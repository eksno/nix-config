# Fallback: auto-configure any monitor not explicitly listed
monitor=,preferred,auto,1

# Dual monitor: external to the right
monitor=HDMI-A-1, 1920x1080@60, 1440x0, 1

# Super+F12: toggle laptop screen off/on (for external-only use)
bind = $mainMod, F12, exec, if hyprctl monitors | grep -q "eDP-1"; then hyprctl keyword monitor eDP-1,disable && hyprctl keyword monitor HDMI-A-1,1920x1080@60,0x0,1; else hyprctl keyword monitor eDP-1,2880x1800@60,0x0,2 && hyprctl keyword monitor HDMI-A-1,1920x1080@60,1440x0,1; fi
