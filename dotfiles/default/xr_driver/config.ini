# xr-driver runtime config.
#
# Deployment: this file is INSTALLED (copied, not symlinked) into
# ~/.config/xr_driver/config.ini by the xr-driver systemd unit's
# ExecStartPre on every (re)start. The driver mutates the live file
# at runtime — e.g., flips `disabled=true` when no headset is plugged.
# Runtime tweaks here will be wiped on the NEXT restart of the unit.
# To change a value persistently, edit this file in the repo and rebuild.
#
# License gate (upstream paywall): `external_mode=breezy_desktop`
# alone does NOT create /dev/shm/breezy_desktop_imu — it also requires
# a productivity-tier license at
# ~/.local/state/xr_driver/<8-char-hwid>_license.json. Without it the
# pose-stream SHM writer never initializes. Free-tier IMU/state still
# works at /dev/shm/xr_driver_state. See xr/STATE.md "Productivity-tier
# license gate" for diagnosis.
#
# Runtime IPC: write commands to /dev/shm/xr_driver_control (single-shot,
# daemon clears after read). See memory/xr-driver-control-ipc.md for the
# verified key set (recenter_screen, sbs_mode=enable|disable).
disabled=false
output_mode=external_only
external_mode=breezy_desktop
use_roll_axis=true
