# Norwegian letters on a US layout. norwegian-type.sh routes to the right
# backend per app: wtype for native Wayland (terminals, Zen, GTK), and
# wl-copy + Ctrl+V through ydotool/uinput for Electron/Chromium clients
# that ignore virtual_keyboard_unstable_v1.
bind = ALT, a, exec, ~/.config/hypr/users/eksno/default/norwegian-type.sh å
bind = ALT SHIFT, a, exec, ~/.config/hypr/users/eksno/default/norwegian-type.sh Å
bind = ALT, o, exec, ~/.config/hypr/users/eksno/default/norwegian-type.sh ø
bind = ALT SHIFT, o, exec, ~/.config/hypr/users/eksno/default/norwegian-type.sh Ø
bind = ALT, e, exec, ~/.config/hypr/users/eksno/default/norwegian-type.sh æ
bind = ALT SHIFT, e, exec, ~/.config/hypr/users/eksno/default/norwegian-type.sh Æ
