# Norwegian letters via ydotool — keeps US layout, no compose key.
# ydotool (not wtype) because Electron/Chromium ignore Wayland's
# virtual_keyboard_unstable_v1; ydotool writes to /dev/uinput instead.
bind = ALT, a, exec, ydotool type -- å
bind = ALT SHIFT, a, exec, ydotool type -- Å
bind = ALT, o, exec, ydotool type -- ø
bind = ALT SHIFT, o, exec, ydotool type -- Ø
bind = ALT, e, exec, ydotool type -- æ
bind = ALT SHIFT, e, exec, ydotool type -- Æ
