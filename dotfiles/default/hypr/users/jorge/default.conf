source = ~/.config/hypr/shared/colors/startino-neptune.conf
source = ~/.config/hypr/shared/themes/default/**.conf
source = ~/.config/hypr/shared/workflow/default/**.conf
source = ~/.config/hypr/shared/workflow/default/binds/qwerty.conf
source = ~/.config/hypr/shared/utility/**.conf
source = ~/.config/hypr/users/jorge/default/**.conf

# Phonetic trigger (0.6.10+ uses `phonetic --trigger <profile>`; the old
# SIGUSR1-via-pidfile mechanism was removed upstream and is silently ignored)
bind = CTRL ALT, r, exec, phonetic --trigger Migrated
