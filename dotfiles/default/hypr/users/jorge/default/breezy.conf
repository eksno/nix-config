# XR sideview (Rayneo Air 4 Pro). Auto-sourced via the **.conf glob in
# users/jorge/default.conf.
#
# Super+T:        toggle sideview (2-screen preset)
# Super+SHIFT+T:  toggle sideview (3-screen — currently falls back to 2-screen
#                 with a warning; upstream gschema lacks a count key)
# Super+R:        recenter pose (works with or without sideview running)

bind = $mainMod, T, exec, breezy-sideview --toggle --preset 2-screen
bind = $mainMod SHIFT, T, exec, breezy-sideview --toggle --preset 3-screen
bind = $mainMod, R, exec, ~/.config/hypr/shared/scripts/breezy-recenter.sh

# Reap sideview on glasses disconnect. Started once per session — Hyprland
# doesn't dedupe exec-once across reloads, but the script blocks on socat,
# so a second copy would just sit idle on a second connection. Cheap.
exec-once = ~/.config/hypr/shared/scripts/breezy-monitor-watcher.sh

# Window placement for the nested gnome-shell. Modern `windowrule` syntax
# inverts the old order: `match:<filter>, <action>` (see eksno's
# startup.conf for the working pattern). Both class and title are matched
# defensively — gnome-shell --nested's app_id varies by mutter version.
# Verify with `hyprctl clients` post first launch and tighten if needed.
windowrule = match:class gnome-shell, float
windowrule = match:title GNOME Shell, float
windowrule = match:class gnome-shell, monitor desc:Technical Concepts Ltd SmartGlasses
windowrule = match:title GNOME Shell, monitor desc:Technical Concepts Ltd SmartGlasses
windowrule = match:class gnome-shell, fullscreen
windowrule = match:title GNOME Shell, fullscreen
