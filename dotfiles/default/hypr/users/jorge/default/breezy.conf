# XR sideview (Rayneo Air 4 Pro). Auto-sourced via the **.conf glob in
# users/jorge/default.conf.
#
# Super+R: recenter pose (writes recenter_screen=true to xr-driver IPC)
#
# World-locked surfaces themselves live in the GNOME-on-Wayland session
# selectable from SDDM — see system/lib/xr/breezy-session. Hyprland keeps
# the recenter binding so the same shortcut works from either compositor.

bind = $mainMod, R, exec, ~/.config/hypr/shared/scripts/breezy-recenter.sh

# Reap any sideview helpers on glasses disconnect. Started once per session
# — Hyprland doesn't dedupe exec-once across reloads, but the script blocks
# on socat, so a second copy would just sit idle on a second connection.
exec-once = ~/.config/hypr/shared/scripts/breezy-monitor-watcher.sh
