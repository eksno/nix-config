# XR sideview (Rayneo Air 4 Pro). Auto-sourced via the **.conf glob in
# users/jorge/default.conf.
#
# Super+R: recenter pose (writes recenter_screen=true to xr-driver IPC)

bind = $mainMod, R, exec, breezy-recenter

# Keep the glasses mirrored cleanly (glasses-as-source, no bars) across
# hotplug/reboot. Applies topology at startup and re-applies on every monitor
# add/remove event. Blocks on socat, so the single exec-once instance lives
# for the whole session.
exec-once = ~/.config/hypr/shared/scripts/glasses-mirror-watcher.sh
