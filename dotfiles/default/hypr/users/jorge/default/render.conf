render {
    # Disable Hyprland color management. With cm_enabled = 1 (default since 0.49)
    # the framebuffer is composed in a CM working space; wlr-screencopy hands
    # that buffer to wayshot, which writes a PNG with no ICC profile, so viewers
    # decode it as plain sRGB and the image looks tinted/washed-out.
    cm_enabled = 0
}
