# Fallback: auto-configure any monitor not explicitly listed
monitor=,preferred,auto,1

# Rayneo AI4 Pro glasses (DP alt-mode over USB-C, comes up as DP-2 etc.)
# Match by description so it works regardless of which DP port is assigned.
# Positioned above the laptop, horizontally centered (laptop effective width
# 2880/1.25 = 2304, glasses width 1920, offset = (2304-1920)/2 = 192).
monitor=desc:Technical Concepts Ltd SmartGlasses, 1920x1080@120, 192x0, 1

# Laptop display: bottom of stack when glasses are connected
monitor=eDP-1, 2880x1800@120, 0x1080, 1.25
