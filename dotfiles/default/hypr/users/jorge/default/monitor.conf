# Fallback: auto-configure any monitor not explicitly listed
monitor=,preferred,auto,1

# Rayneo AI4 Pro glasses (DP alt-mode over USB-C, comes up as DP-2 etc.)
# Match by description so it works regardless of which DP port is assigned.
# Mirror the VG258 external monitor when it's connected (position/scale
# ignored in mirror mode). If HDMI-A-1 is absent the line is a no-op and
# the glasses fall through to the `,preferred,auto,1` fallback above —
# in that case they show up as a standalone display rather than being mirrored.
monitor=desc:Technical Concepts Ltd SmartGlasses, 1920x1080@120, auto, 1, mirror, HDMI-A-1

# External VG258 is the source: drives a native 1920x1080 framebuffer so the
# external displays sharp at correct aspect ratio. Laptop and glasses mirror it.
#
# Refresh capped at 60Hz (down from 119.98) because 120 Hz on HDMI-A-1 +
# 120 Hz eDP-1 + 60 Hz on DP-2 (glasses, 3840x1080 SBS mode) exceeds Intel
# CDCLK budget. Symptom was Hyprland ERR `drm: Cannot commit when a
# page-flip is awaiting` looping after the DRM lease event, watchdog
# killing Hyprland into safe-mode every XR session.
monitor=HDMI-A-1, 1920x1080@60.00, 0x0, 1

# Laptop display mirrors the external (16:9 source stretched into 16:10 panel,
# but the external looks right which is what we want when both are visible).
monitor=eDP-1, 2880x1800@120, 0x0, 1.25, mirror, HDMI-A-1
