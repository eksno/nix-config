$mainMod = SUPER

# Kill active window
bind = $mainMod, delete, killactive,

# Hyprland Functions
bind = $mainMod, period, togglefloating,
bind = $mainMod, comma, pseudo,
bind = $mainMod, semicolon, layoutmsg, togglesplit

# Run Menu
bindr= SUPER, SUPER_L, exec, pkill tofi-run || $(tofi-run --font /usr/share/fonts/noto/NotoSansMono-Regular.ttf) # run and eval tofi run

# ---------------- #
# Screenshots (grim)
# ---------------- #

# Region screenshot -> clipboard
bind = $mainMod, k, exec, sh -c "grim -g \"$(slurp)\" - | wl-copy"

# Focused monitor screenshot -> clipboard
bind = $mainMod SHIFT, k, exec, sh -c "mon=$(hyprctl monitors -j | jq -r '.[] | select(.focused==true).name'); grim -o \"$mon\" - | wl-copy"


# ---------------- #
# Screen Recording (wl-screenrec)
# ---------------- #

# Region recording -> clipboard (ephemeral, no file saved)
bind = $mainMod, x, exec, sh -c "notify-send 'Recording' 'Region capture started (clipboard only)'; wl-screenrec -g \"$(slurp)\" -o - | wl-copy --type=video/mp4; notify-send 'Recording' 'Region capture copied to clipboard'"

# Focused monitor recording -> clipboard (ephemeral, no file saved)
bind = $mainMod SHIFT, x, exec, sh -c "mon=$(hyprctl monitors -j | jq -r '.[] | select(.focused==true).name'); notify-send 'Recording' \"Monitor $mon capture started (clipboard only)\"; wl-screenrec -o \"$mon\" - | wl-copy --type=video/mp4; notify-send 'Recording' \"Monitor $mon capture copied to clipboard\""

# Stop recording
bind = $mainMod CTRL, x, exec, sh -c "pkill -INT wl-screenrec && notify-send 'Recording' 'Stopped'"

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ---------- #
# Workspaces #
# ---------- #

# Home Row
bind = $mainMod, a, workspace, 1
bind = $mainMod, o, workspace, 2
bind = $mainMod, e, workspace, 3
bind = $mainMod, u, workspace, 4
bind = $mainMod, i, workspace, 5
bind = $mainMod, d, workspace, 6
bind = $mainMod, h, workspace, 7
bind = $mainMod, t, workspace, 8
bind = $mainMod, n, workspace, 9
bind = $mainMod, s, workspace, 10

# Top Row
bind = $mainMod, g, workspace, 11
bind = $mainMod, c, workspace, 12
bind = $mainMod, r, workspace, 13
bind = $mainMod, l, workspace, 14

# Bottom Row
bind = $mainMod, m, workspace, 15
bind = $mainMod, w, workspace, 16
bind = $mainMod, v, workspace, 17
bind = $mainMod, z, workspace, 18

# ------------------ #
# Move to Workspaces #
# ------------------ #

# Home Row
bind = $mainMod SHIFT, a, movetoworkspace, 1
bind = $mainMod SHIFT, o, movetoworkspace, 2
bind = $mainMod SHIFT, e, movetoworkspace, 3
bind = $mainMod SHIFT, u, movetoworkspace, 4
bind = $mainMod SHIFT, i, movetoworkspace, 5
bind = $mainMod SHIFT, d, movetoworkspace, 6
bind = $mainMod SHIFT, h, movetoworkspace, 7
bind = $mainMod SHIFT, t, movetoworkspace, 8
bind = $mainMod SHIFT, n, movetoworkspace, 9
bind = $mainMod SHIFT, s, movetoworkspace, 10

# Top Row
bind = $mainMod SHIFT, g, movetoworkspace, 11
bind = $mainMod SHIFT, c, movetoworkspace, 12
bind = $mainMod SHIFT, r, movetoworkspace, 13
bind = $mainMod SHIFT, l, movetoworkspace, 14

# Bottom Row
bind = $mainMod SHIFT, m, movetoworkspace, 15
bind = $mainMod SHIFT, w, movetoworkspace, 16
bind = $mainMod SHIFT, v, movetoworkspace, 17
bind = $mainMod SHIFT, z, movetoworkspace, 18

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
