animations {
  enabled = true

  # █▄▄ █▀▀ ▀█ █ █▀▀ █▀█   █▀▀ █ █ █▀█ █ █ █▀▀
  # █▄█ ██▄ █▄ █ ██▄ █▀▄   █▄▄ █▄█ █▀▄ ▀▄▀ ██▄
  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  # Snappy: easeOutExpo. Motion is distributed across the whole duration
  # with a visible deceleration tail that lands cleanly at 1.0 — eye sees
  # fast→decel→stop within the same window. Avoids the "drifted after it
  # looked done" feel of more aggressively front-loaded curves.
  bezier = snap, 0.16, 1, 0.3, 1

  
  #▄▀█ █▄ █ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄ █
  #█▀█ █ ▀█ █ █ ▀ █ █▀█  █  █ █▄█ █ ▀█
  animation = windows, 1, 6, wind, slide
  animation = windowsIn, 1, 6, winIn, slide
  animation = windowsOut, 1, 5, winOut, slide
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, liner
  animation = borderangle, 1, 30, liner, loop
  animation = fade, 1, 10, default
  animation = workspaces, 1, 1, snap, slide
}
