# Make tofi appear instantly: skip the global fade animation on its
# layer-shell surface. Hyprland 0.54+ layerrule syntax is comma-separated
# `key value` pairs, with `match:<prop>` for matchers and snake_case
# effect names (no_anim, not noanim).
# Note: tofi sets its layer-shell namespace to "launcher" (hardcoded in
# tofi src/main.c → zwlr_layer_shell_v1_get_layer_surface(..., "launcher")),
# NOT "tofi". Match on that string.
layerrule = match:namespace ^(launcher)$, no_anim 1

# Toucan keyboard cheatsheet (eww). Make the surface fully click-through
# (no pointer events) so it can sit on top of full-screen apps without
# stealing input. ignorealpha 1 = ignore input wherever alpha < 1.0.
layerrule = match:namespace ^(kbd-cheatsheet)$, ignorealpha 0.95
layerrule = match:namespace ^(kbd-cheatsheet)$, no_anim 1
