# monitor=eDP-1,preferred,auto,60

# When the TV is connected it is the primary picture at native 4K60
# (preferred/auto picks its broken 30Hz EDID default), and the laptop
# panel mirrors it. The TV's 16:9 wins; the laptop gets the letterbox.
monitor=HDMI-A-1, 3840x2160@60, auto, 1.5
monitor=eDP-1, 2880x1800@60, auto, 2, mirror, HDMI-A-1
